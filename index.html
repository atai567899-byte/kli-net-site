<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כלי-נט | רישום לקיחת כלים</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#12315a;color:white;padding:20px}
.wrap{max-width:900px;margin:22px auto;padding:0 14px}
.card{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 16px #142b4b0d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-weight:bold;margin:10px 0 5px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px}
textarea{min-height:85px}
button{border:0;border-radius:9px;padding:11px 15px;background:#1763bd;color:white;cursor:pointer;font-weight:bold;margin-top:12px}
button:disabled{opacity:.6;cursor:wait}
.secondary{background:#e6edf6;color:#17324f}
.danger{background:#b42318}
.hidden{display:none!important}
.muted{color:#64748b;font-size:14px}
.notice{padding:11px;border-radius:9px;background:#eef6ff;margin:10px 0}
.error{background:#fff0f0;color:#9f1c1c}
.success{background:#eaf8ef;color:#176638}
.item{border:1px solid #e2e8f0;padding:14px;border-radius:10px;margin:10px 0}
.item strong{display:block;margin-bottom:7px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{margin:0}
.active{background:#0e2340}
@media(max-width:600px){.card{padding:14px}}
</style>
</head>
<body>
<header>
  <h1>כלי-נט</h1>
  <p>רישום לקיחת כלים ומעקב אחר רישומים פתוחים</p>
</header>

<div class="wrap">

<section class="card">
  <h2>טופס רישום לקיחת כלי</h2>
  <p class="muted">מלא את הפרטים בעת לקיחת כלי.</p>
  <div id="publicMsg" class="notice hidden"></div>

  <label for="tool">מספר הכלי</label>
  <select id="tool">
    <option value="">טוען ציוד...</option>
  </select>

  <div class="grid">
    <div>
      <label for="borrower">שם הלוקח</label>
      <input id="borrower" maxlength="100" required>
    </div>
    <div>
      <label for="phone">טלפון (לא חובה)</label>
      <input id="phone" maxlength="30">
    </div>
    <div>
      <label for="due">תאריך החזרה מתוכנן (לא חובה)</label>
      <input id="due" type="date">
    </div>
  </div>

  <label for="note">הערה</label>
  <textarea id="note" maxlength="500"
    placeholder="לדוגמה: נלקח כלי זה מספר 72636382"></textarea>

  <button id="submitBtn" onclick="submitLoan()">רישום לקיחת כלי</button>
</section>

<section class="card">
  <div class="toprow">
    <div>
      <h2>כניסת מנהל</h2>
      <p class="muted">צפייה ברישומים פתוחים וסגירתם.</p>
    </div>
    <button id="logoutBtn" class="secondary hidden" onclick="logout()">התנתקות</button>
  </div>

  <div id="authMsg" class="notice hidden"></div>
  <div id="loginBox" class="grid">
    <div>
      <label for="email">אימייל מנהל</label>
      <input id="email" type="email" autocomplete="username">
    </div>
    <div>
      <label for="password">סיסמה</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
  </div>
  <button id="loginBtn" onclick="login()">כניסה לניהול</button>

  <div id="adminArea" class="hidden">
    <hr>
    <div class="toprow">
      <h2>רישומים פתוחים</h2>
      <button class="secondary" onclick="loadLoans()">רענון</button>
    </div>
    <div id="loansList">טוען...</div>

    <h2>היסטוריית רישומים סגורים</h2>
    <button class="secondary" onclick="loadHistory()">רענון היסטוריה</button>
    <div id="historyList"></div>

    <h2>הוספת כלי למלאי</h2>
    <label for="newTool">שם הכלי</label>
    <input id="newTool" maxlength="120" placeholder="שם הכלי">
    <label for="newCode">מספר מזהה</label>
    <input id="newCode" maxlength="80" placeholder="לדוגמה: 72636382">
    <button onclick="addTool()">שמירת כלי</button>
  </div>
</section>

<p class="muted">אין להזין מידע מסווג, מבצעי או מידע צבאי רגיש.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';

const SUPABASE_URL = "https://fvtqcfkuouvlvzummsdu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wSm_gL5Tis4mFM_OAjEcnw_31pHY9do";

const $ = id => document.getElementById(id);
let sb = null;
let currentUser = null;

function ready() {
  if (!window.supabase) {
    msg('publicMsg', 'Supabase לא נטען. בדוק חיבור לאינטרנט.', true);
    return false;
  }
  if (!sb) {
    sb = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
    );
  }
  return true;
}

function msg(id, text, error = false) {
  const el = $(id);
  el.textContent = text;
  el.classList.remove('hidden', 'error', 'success');
  el.classList.add(error ? 'error' : 'success');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&#39;'
  }[c]));
}

function dateTime(s) {
  if (!s) return '—';
  return new Date(s).toLocaleString('he-IL');
}

async function loadTools() {
  if (!ready()) return;

  const { data, error } = await sb.from('tools')
    .select('id,name,tool_identifier,condition')
    .order('name');

  if (error) {
    $('tool').innerHTML = '<option value="">לא ניתן לטעון ציוד</option>';
    msg('publicMsg', 'שגיאה בטעינת הציוד: ' + error.message, true);
    return;
  }

  $('tool').innerHTML = '<option value="">בחר כלי</option>' +
    (data || []).map(t =>
      `<option value="${esc(t.id)}">${esc(t.tool_identifier || 'ללא מספר')} — ${esc(t.name)}</option>`
    ).join('');
}

async function submitLoan() {
  if (!ready()) return;

  const tool_id = $('tool').value;
  const borrower_name = $('borrower').value.trim();
  const borrower_phone = $('phone').value.trim();
  const reason = $('note').value.trim();
  const due_date = $('due').value || null;

  if (!tool_id || borrower_name.length < 2) {
    msg('publicMsg', 'בחר כלי והזן את שם הלוקח.', true);
    return;
  }

  const btn = $('submitBtn');
  btn.disabled = true;

  try {
    const { error } = await sb.from('tool_loans').insert({
      tool_id,
      borrower_name,
      borrower_phone,
      reason,
      due_date
    });

    if (error) {
      msg('publicMsg', 'לא ניתן לשמור את הרישום: ' + error.message, true);
      return;
    }

    msg('publicMsg', 'הרישום נשמר בהצלחה.');
    $('tool').value = '';
    $('borrower').value = '';
    $('phone').value = '';
    $('note').value = '';
    $('due').value = '';
  } catch (e) {
    msg('publicMsg', 'שגיאה בשמירת הרישום: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

async function login() {
  if (!ready()) return;

  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || !password) {
    msg('authMsg', 'הזן אימייל וסיסמה.', true);
    return;
  }

  $('loginBtn').disabled = true;

  try {
    const { data, error } = await sb.auth.signInWithPassword({
      email, password
    });

    if (error) {
      msg('authMsg', 'ההתחברות נכשלה: ' + error.message, true);
      return;
    }

    currentUser = data.user;
    await enterAdmin();
  } finally {
    $('loginBtn').disabled = false;
  }
}

async function enterAdmin() {
  const { data, error } = await sb.from('admin_users')
    .select('user_id')
    .eq('user_id', currentUser.id)
    .maybeSingle();

  if (error) {
    msg('authMsg', 'בדיקת הרשאות נכשלה: ' + error.message, true);
    return;
  }

  if (!data) {
    await sb.auth.signOut();
    currentUser = null;
    msg('authMsg', 'אין למשתמש הרשאת מנהל.', true);
    return;
  }

  $('adminArea').classList.remove('hidden');
  $('loginBox').classList.add('hidden');
  $('loginBtn').classList.add('hidden');
  $('logoutBtn').classList.remove('hidden');
  msg('authMsg', 'התחברת בהצלחה.');

  await loadLoans();
  await loadHistory();
}

async function logout() {
  const { error } = await sb.auth.signOut();
  if (error) {
    msg('authMsg', 'שגיאה בהתנתקות: ' + error.message, true);
    return;
  }

  currentUser = null;
  $('adminArea').classList.add('hidden');
  $('loginBox').classList.remove('hidden');
  $('loginBtn').classList.remove('hidden');
  $('logoutBtn').classList.add('hidden');
  msg('authMsg', 'התנתקת.');
}

async function loadLoans() {
  if (!currentUser) return;

  const { data, error } = await sb.from('tool_loans')
    .select('id,tool_id,borrower_name,borrower_phone,reason,due_date,created_at,tools(name,tool_identifier)')
    .is('returned_at', null)
    .order('created_at', { ascending: false });

  if (error) {
    $('loansList').textContent = 'שגיאה בטעינת הרישומים: ' + error.message;
    return;
  }

  $('loansList').innerHTML = data.length ? data.map(l => `
    <div class="item">
      <strong>כלי ${esc(l.tools?.tool_identifier || 'ללא מספר')} — ${esc(l.tools?.name || '')}</strong>
      <div>לוקח: ${esc(l.borrower_name)}</div>
      <div>טלפון: ${esc(l.borrower_phone || '—')}</div>
      <div>נרשם: ${esc(dateTime(l.created_at))}</div>
      <div>החזרה מתוכננת: ${esc(l.due_date || 'לא צוין')}</div>
      <p><b>הערה:</b> ${esc(l.reason || 'אין הערה')}</p>
      <button class="danger" onclick="closeLoan('${l.id}')">סגירת רישום</button>
    </div>
  `).join('') : 'אין רישומים פתוחים.';
}

async function closeLoan(id) {
  if (!confirm('לסגור את הרישום הזה?')) return;

  const { error } = await sb.from('tool_loans')
    .update({ returned_at: new Date().toISOString() })
    .eq('id', id);

  if (error) {
    alert('לא ניתן לסגור את הרישום: ' + error.message);
    return;
  }

  await loadLoans();
  await loadHistory();
}

async function loadHistory() {
  if (!currentUser) return;

  const { data, error } = await sb.from('tool_loans')
    .select('id,borrower_name,reason,returned_at,created_at,tools(name,tool_identifier)')
    .not('returned_at', 'is', null)
    .order('returned_at', { ascending: false })
    .limit(100);

  if (error) {
    $('historyList').textContent = 'שגיאה בטעינת ההיסטוריה: ' + error.message;
    return;
  }

  $('historyList').innerHTML = data.length ? data.map(l => `
    <div class="item">
      <strong>כלי ${esc(l.tools?.tool_identifier || 'ללא מספר')} — ${esc(l.tools?.name || '')}</strong>
      <div>לוקח: ${esc(l.borrower_name)}</div>
      <div>נרשם: ${esc(dateTime(l.created_at))}</div>
      <div>נסגר: ${esc(dateTime(l.returned_at))}</div>
      <p><b>הערה:</b> ${esc(l.reason || 'אין הערה')}</p>
    </div>
  `).join('') : 'אין רישומים סגורים.';
}

async function addTool() {
  const name = $('newTool').value.trim();
  const tool_identifier = $('newCode').value.trim();

  if (!name || !tool_identifier) {
    alert('הזן שם כלי ומספר מזהה.');
    return;
  }

  const { error } = await sb.from('tools').insert({
    name, tool_identifier, condition: 'תקין'
  });

  if (error) {
    alert('לא ניתן להוסיף כלי: ' + error.message);
    return;
  }

  $('newTool').value = '';
  $('newCode').value = '';
  await loadTools();
  alert('הכלי נוסף בהצלחה.');
}

(async function init() {
  if (!ready()) return;
  await loadTools();

  const { data, error } = await sb.auth.getSession();
  if (!error && data.session) {
    currentUser = data.session.user;
    await enterAdmin();
  }
})();
</script>
</body>
</html>
